[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hauslog"
dynamic = ["version"]
description = "Zählerstände erfassen – offline und gemeinsam"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "paddy911" }]
dependencies = [
  "PySide6-Essentials>=6.8",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
hauslog = "hauslog.app:main"

[tool.hatch.version]
path = "src/hauslog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hauslog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 90
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
