name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"
  POCKETBASE_VERSION: "0.40.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generierten Code prüfen
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/daten/datenbank.g.dart
      - run: dart analyze --fatal-infos
      - name: PocketBase für Sync-Tests starten
        run: |
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}/pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          unzip -q pb.zip pocketbase -d /tmp/pb
          /tmp/pb/pocketbase migrate up --dir /tmp/pb/data --migrationsDir server/pb_migrations
          /tmp/pb/pocketbase superuser upsert ci@test.local ci-passwort-123 --dir /tmp/pb/data
          /tmp/pb/pocketbase serve --http 127.0.0.1:8090 --dir /tmp/pb/data --migrationsDir server/pb_migrations &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8090/api/health && break; sleep 1; done
      - run: flutter test
        env:
          PB_URL: http://127.0.0.1:8090
          PB_ADMIN: ci@test.local
          PB_ADMIN_PASSWORT: ci-passwort-123

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - name: ZIP erstellen
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Hauslog-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Hauslog-*-windows-x64.zip

  linux:
    needs: test
    # Möglichst alte Basis, damit das AppImage auch auf älteren Systemen läuft.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release
      - run: bash packaging/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/Hauslog-*.AppImage

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: bash tool/web_dateien.sh
      - run: flutter build web --release
      - name: ZIP erstellen
        run: |
          version=$(awk '/^version:/{split($2, v, "+"); print v[1]}' pubspec.yaml)
          (cd build/web && zip -qr "../../Hauslog-$version-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: Hauslog-*-web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Hauslog-*
          generate_release_notes: true
