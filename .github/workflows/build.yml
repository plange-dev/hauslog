name: Build

on:
  push:
    branches: [main, python-umbau]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  POCKETBASE_VERSION: "0.40.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt-Systembibliotheken
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - name: PocketBase für Sync-Tests starten
        run: |
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}/pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          unzip -q pb.zip pocketbase -d /tmp/pb
          /tmp/pb/pocketbase migrate up --dir /tmp/pb/data --migrationsDir server/pb_migrations
          /tmp/pb/pocketbase superuser upsert ci@test.local ci-passwort-123 --dir /tmp/pb/data
          /tmp/pb/pocketbase serve --http 127.0.0.1:8090 --dir /tmp/pb/data --migrationsDir server/pb_migrations &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8090/api/health && break; sleep 1; done
      - run: pytest -v
        env:
          PB_URL: http://127.0.0.1:8090
          PB_ADMIN: ci@test.local
          PB_ADMIN_PASSWORT: ci-passwort-123

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/hauslog.spec
      - name: Installer bauen
        shell: pwsh
        run: |
          $version = python -c "import hauslog; print(hauslog.__version__)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=$version" packaging\windows\hauslog.iss
      - name: Installer testen (still installieren und starten)
        shell: pwsh
        run: |
          $setup = Get-Item build\Hauslog-*-Setup.exe
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Hauslog\hauslog.exe"
          if (-not (Test-Path $exe)) { throw "nicht installiert: $exe" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Hauslog hat sich beendet (Exitcode $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:LOCALAPPDATA\Hauslog\hauslog.db")) { throw "keine Datenbank angelegt" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Hauslog-*-Setup.exe

  ubuntu:
    needs: test
    # Älteste unterstützte Basis, damit das Paket auf 22.04 und neuer läuft.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/hauslog.spec
      - run: bash packaging/linux/deb_bauen.sh
      - name: Paket testen (installieren und starten)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./build/hauslog_*_amd64.deb xvfb
          xvfb-run -a timeout 8 hauslog || test $? -eq 124
          test -f ~/.local/share/hauslog/hauslog.db
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: build/hauslog_*_amd64.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Hauslog-*-Setup.exe
            hauslog_*_amd64.deb
          generate_release_notes: true
